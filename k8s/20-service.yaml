apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  namespace: heart-disease
  labels:
    app.kubernetes.io/name: heart-disease-api
spec:
  # Use LoadBalancer so `minikube tunnel` exposes a real IP.
  # On a managed cloud (GKE/EKS/AKS) the cloud-controller-manager
  # provisions an external load balancer automatically.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heart-disease-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
